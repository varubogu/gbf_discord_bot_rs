spreadsheet.loading:
  ja: "🔄 ギルドスプレッドシートからデータを読み込んでいます..."
  en: "🔄 Loading data from guild spreadsheet..."
spreadsheet.load_success:
  ja: "✅ ギルドスプレッドシート読み込み完了\n\n📊 読み込み結果:\n- 成功: {{success_count}}テーブル\n- 総行数: {{total_rows}}行"
  en: "✅ Guild spreadsheet load completed\n\n📊 Results:\n- Success: {{success_count}} tables\n- Total rows: {{total_rows}}"
spreadsheet.load_partial_success:
  ja: "⚠️ ギルドスプレッドシート読み込み完了（一部エラー）\n\n📊 読み込み結果:\n- 成功: {{success_count}}テーブル\n- 失敗: {{failure_count}}テーブル\n- 総行数: {{total_rows}}行\n\n{{error_details}}"
  en: "⚠️ Guild spreadsheet load completed (with errors)\n\n📊 Results:\n- Success: {{success_count}} tables\n- Failed: {{failure_count}} tables\n- Total rows: {{total_rows}}\n\n{{error_details}}"
spreadsheet.load_failed:
  ja: "❌ ギルドスプレッドシート読み込み失敗\n\n{{error_msg}}"
  en: "❌ Guild spreadsheet load failed\n\n{{error_msg}}"
spreadsheet.registering:
  ja: "🔄 ギルドスプレッドシートを登録しています..."
  en: "🔄 Registering guild spreadsheet..."
spreadsheet.register_success:
  ja: "✅ ギルドスプレッドシートを登録しました\n\n📊 登録内容:\n- 読み込み用: <{{load_url}}>\n- 書き込み用: <{{push_url}}>\n\nこれで `/gspread_load` と `/gspread_push` コマンドが使用可能になりました。"
  en: "✅ Guild spreadsheet registered successfully\n\n📊 Registration details:\n- Load spreadsheet: <{{load_url}}>\n- Push spreadsheet: <{{push_url}}>\n\nYou can now use the `/gspread_load` and `/gspread_push` commands."
spreadsheet.register_failed:
  ja: "❌ ギルドスプレッドシート登録失敗\n\n{{error_msg}}"
  en: "❌ Guild spreadsheet registration failed\n\n{{error_msg}}"
spreadsheet.pushing:
  ja: "🔄 ギルドデータをスプレッドシートに書き込んでいます..."
  en: "🔄 Writing guild data to spreadsheet..."
spreadsheet.push_success:
  ja: "✅ ギルドデータ書き込み完了\n\n📊 書き込み結果:\n- 成功: {{success_count}}テーブル\n- 総行数: {{total_rows}}行"
  en: "✅ Guild data write completed\n\n📊 Results:\n- Success: {{success_count}} tables\n- Total rows: {{total_rows}}"
spreadsheet.push_partial_success:
  ja: "⚠️ ギルドデータ書き込み完了（一部エラー）\n\n📊 書き込み結果:\n- 成功: {{success_count}}テーブル\n- 失敗: {{failure_count}}テーブル\n- 総行数: {{total_rows}}行\n\n{{error_details}}"
  en: "⚠️ Guild data write completed (with errors)\n\n📊 Results:\n- Success: {{success_count}} tables\n- Failed: {{failure_count}} tables\n- Total rows: {{total_rows}}\n\n{{error_details}}"
spreadsheet.push_failed:
  ja: "❌ ギルドデータ書き込み失敗\n\n{{error_msg}}"
  en: "❌ Guild data write failed\n\n{{error_msg}}"
spreadsheet.global_pushing:
  ja: "🔄 グローバルデータをスプレッドシートに書き込んでいます..."
  en: "🔄 Writing global data to spreadsheet..."
spreadsheet.global_push_success:
  ja: "✅ グローバルデータ書き込み完了\n\n📊 書き込み結果:\n- 成功: {{success_count}}テーブル\n- 総行数: {{total_rows}}行"
  en: "✅ Global data write completed\n\n📊 Results:\n- Success: {{success_count}} tables\n- Total rows: {{total_rows}}"
spreadsheet.global_push_partial_success:
  ja: "⚠️ グローバルデータ書き込み完了（一部エラー）\n\n📊 書き込み結果:\n- 成功: {{success_count}}テーブル\n- 失敗: {{failure_count}}テーブル\n- 総行数: {{total_rows}}行\n\n{{error_details}}"
  en: "⚠️ Global data write completed (with errors)\n\n📊 Results:\n- Success: {{success_count}} tables\n- Failed: {{failure_count}} tables\n- Total rows: {{total_rows}}\n\n{{error_details}}"
spreadsheet.global_push_failed:
  ja: "❌ グローバルデータ書き込み失敗\n\n{{error_msg}}"
  en: "❌ Global data write failed\n\n{{error_msg}}"

kosenjo.before_3_days:
  ja: "3日後に古戦場が始まります。"
  en: "The Guild War will begin in 3 days."
kosenjo.before_1_day:
  ja: "明日、古戦場が始まります。\n各自個人のアサルトタイムを見直しましょう。"
  en: "The Guild War will begin tomorrow.\nPlease review your Assault Time settings."
kosenjo.qualifying_start:
  ja: "古戦場予選が始まりました。"
  en: "The Guild War preliminaries have started."
kosenjo.qualifying_end:
  ja: "予選お疲れ様でした。明日はインターバルです。"
  en: "Good work on the preliminaries. Tomorrow is the interval day."
kosenjo.qualifying_end_no_interval:
  ja: "予選お疲れ様でした。明日はインターバルではなく7:00から本戦です。明日に備えて寝ましょう。"
  en: "Good work on the preliminaries. Tomorrow is not an interval - the finals start at 7:00. Get some rest for tomorrow."
kosenjo.main_tournament_before_1_day:
  ja: "7:00から本戦が始まります。明日に備えて寝ましょう"
  en: "The finals will begin at 7:00. Get some rest for tomorrow."
kosenjo.main_tournament_day_start:
  ja: "古戦場本戦が始まりました。"
  en: "The Guild War finals have started."
kosenjo.main_tournament_half_day:
  ja: "古戦場本戦の半日が経過しました。"
  en: "Half a day has passed in the Guild War finals."
kosenjo.main_tournament_day_end:
  ja: "古戦場本戦終了時間です。明日に備えて寝ましょう。"
  en: "The Guild War finals day has ended. Get some rest for tomorrow."
kosenjo.main_tournament_end:
  ja: "本戦お疲れ様でした。明日はスペシャルバトルです。"
  en: "Good work on the finals. Tomorrow is the Special Battle."
kosenjo.sp_battle_end:
  ja: "スペシャルバトルお疲れ様でした。次回古戦場予定を確認しましょう。"
  en: "Good work on the Special Battle. Please check the schedule for the next Guild War."
kosenjo.team_ability_1:
  ja: "@here 団アビ1回目の発動時間です。"
  en: "@here It's time to activate the 1st crew buff."
kosenjo.team_ability_2:
  ja: "2回目の団アビが発動し忘れてないか確認しましょう"
  en: "Let's check if we forgot to activate the 2nd crew buff."

dorebara.start:
  ja: "ドレバラ開始しました。報酬全部取れるまで走りましょう。"
  en: "Dread Barrage has started. Let's aim to get all the rewards."
dorebara.end:
