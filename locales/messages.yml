schedule.presenter.creation.description:
  en: "**Schedule Name**: {{schedule_name}}\n**Schedule ID**: {{schedule_id}}\n**Quest**: {{quest_name}} (ID: {{quest_id}})\n**Battle Style**: {{battle_style_name}}\n**Target Days**: {{days_display}} ({{timezone}} timezone)\n**Quest Start Time**: {{quest_start_time}}\n**Recruitment Start**: {{recruit_start_day_offset}} day(s) before at {{recruit_start_time}}\n**Dismissal Times**: {{dismissal_display}}\n**Note**: {{note_display}}\n**Created By**: <@{{user_id}}>\n\nRecruitments will be posted automatically based on this schedule.\nParticipant limits follow each quest setting."
  ja: "**スケジュール名**: {{schedule_name}}\n**スケジュールID**: {{schedule_id}}\n**クエスト**: {{quest_name}} (ID: {{quest_id}})\n**マルチ攻略方法**: {{battle_style_name}}\n**対象曜日**: {{days_display}} ({{timezone}}タイムゾーン)\n**クエスト開始時刻**: {{quest_start_time}}\n**募集開始**: {{recruit_start_day_offset}}日前の{{recruit_start_time}}\n**解散時刻**: {{dismissal_display}}\n**備考**: {{note_display}}\n**作成者**: <@{{user_id}}>\n\nこのスケジュールに基づいて、自動的に募集が投稿されます。\n参加人数はクエストごとの設定を使用します。"
