[package]
name = "gbf_discord_bot_rs"
version = "0.6.1"
edition = "2024"

[dependencies]
poise = "0.6.1"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
dotenv = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros"] }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
migration = { path = "./migration" }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
regex = "1.11.1"
log = { version = "0.4.27" }
logcall = { version = "0.1.11"}
rust-i18n = "3.1.5"
futures = "0.3.31"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio-cron-scheduler = "0.15.0"
google-sheets4 = "5.0"
hyper = "0.14"
hyper-rustls = "0.24"


[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
test-log = { version = "0.2", features = ["trace"] }
env_logger = "0.10"
tempfile = "3.13"
serial_test = "3.2"

[[bin]]
name = "schema_lint"
path = "tools/schema_lint.rs"

[[bin]]
name = "cleanup"
path = "src/bin/cleanup.rs"
