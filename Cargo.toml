[package]
name = "gbf_discord_bot_rs"
version = "0.8.0"
edition = "2024"

[dependencies]
poise = "0.6.2"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal"] }
dotenv = "0.15"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros"] }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
migration = { path = "./migration" }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.5"
regex = "1.12"
log = { version = "0.4" }
logcall = { version = "0.2"}
rust-i18n = "4.2"
futures = "0.3"
thiserror = "2.0"
uuid = { version = "^1.26", features = ["v4", "serde"] }
tokio-cron-scheduler = "0.15"
google-sheets4 = "5.0"
hyper = "1.11"
hyper-rustls = "0.27"


[dev-dependencies]
tokio-test = "0.4"
mockall = "^0.15"
test-log = { version = "0.2", features = ["trace"] }
env_logger = "0.11"
tempfile = "3.27"
serial_test = "4.0"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[[bin]]
name = "schema_lint"
path = "tools/schema_lint.rs"

[[bin]]
name = "cleanup"
path = "src/bin/cleanup.rs"
