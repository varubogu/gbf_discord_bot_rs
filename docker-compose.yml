networks:
  app_network:
    driver: bridge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      # Rustマルチステージビルド: 最終ステージが自動的に使用される
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: db
      TZ: UTC  # タイムゾーンを明示的にUTCに設定
    volumes:
      # Google Service Account Keyファイルを読み取り専用でマウント
      - ./.local:/app/.local:ro
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy  # DBのヘルスチェック完了を待つ
    logging:
      options:
        max-size: "10m"
        max-file: "3"

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    env_file:
      - .env  # .envから環境変数を読み込み
    environment:
      # PostgreSQL管理者設定
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC  # タイムゾーンを明示的にUTCに設定
      # 以下の変数は.envから読み込まれ、init.shで使用されます:
      # - DB_NAME
      # - SYSTEM_DB_PASSWORD
      # - GUILD_DB_PASSWORD
      # - GLOBAL_DB_PASSWORD
      # - ADMIN_DB_PASSWORD
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pgdata:
