networks:
  app_network:
    driver: bridge

services:
  app:
    # ビルド済みイメージをGHCRからpull
    # イメージ名は自動的に ghcr.io/<OWNER>/<REPO>:latest になります
    # 例: ghcr.io/your-username/gbf_discord_bot_rs:latest
    image: ghcr.io/${GITHUB_REPOSITORY:-your-username/gbf_discord_bot_rs}:latest
    restart: always
    env_file:
      - .env.app
    environment:
      DB_HOST: db
      TZ: UTC  # タイムゾーンを明示的にUTCに設定
    volumes:
      # Google Service Account Keyファイルを読み取り専用でマウント
      - ./.local:/app/.local:ro
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy  # DBのヘルスチェック完了を待つ
    logging:
      options:
        max-size: "10m"
        max-file: "3"

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    # DBイメージもGHCRからpull
    image: ghcr.io/${GITHUB_REPOSITORY:-your-username/gbf_discord_bot_rs}-db:latest
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    env_file:
      - .env.db  # .envから環境変数を読み込み
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pgdata:
