networks:
  app_network:
    driver: bridge

services:
  app:
    # 本番用：ビルド済みイメージをGHCRからpull
    # イメージ名は自動的に ghcr.io/<OWNER>/<REPO>:latest になります
    # 例: ghcr.io/your-username/gbf_discord_bot_rs:latest
    # 「GITHUB_REPOSITORY」は「username/repositoryname」形式
    image: ghcr.io/${GITHUB_REPOSITORY:-varubogu/gbf_discord_bot_rs}:latest

    # # 検証用：ビルドする
    # build:
    #   context: .
    #   dockerfile: Dockerfile.app
    restart: always
    env_file:
      - .env.app
    environment:
      DB_HOST: db
      TZ: UTC  # タイムゾーンを明示的にUTCに設定
    volumes:
      # Google Service Account Keyファイルを読み取り専用でマウント
      - ./.local:/app/.local:ro
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy  # DBのヘルスチェック完了を待つ
    logging:
      options:
        max-size: "10m"
        max-file: "3"

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    # DBイメージもGHCRからpull ※説明はappの方を参照
    image: ghcr.io/${GITHUB_REPOSITORY:-varubogu/gbf_discord_bot_rs}-db:latest
    # # 検証用：ビルドする
    # build:
    #   context: .
    #   dockerfile: Dockerfile.db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    env_file:
      - .env.db  # .env.dbから環境変数を読み込み
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  maintenance:
    # メンテナンスイメージもGHCRからpull
    image: ghcr.io/${GITHUB_REPOSITORY:-varubogu/gbf_discord_bot_rs}-maintenance:latest
    # # 検証用：ビルドする
    # build:
    #   context: .
    #   dockerfile: Dockerfile.maintenance
    env_file:
      - .env.maintenance
    environment:
      DB_HOST: db
      TZ: UTC
      CLEANUP_EXECUTION_MODE: once
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - maintenance  # デフォルトでは起動しない（手動実行用）

  maintenance_scheduler:
    # 定期クリーンアップ実行用（通常起動時に常駐）
    image: ghcr.io/${GITHUB_REPOSITORY:-varubogu/gbf_discord_bot_rs}-maintenance:latest
    # # 検証用：ビルドする
    # build:
    #   context: .
    #   dockerfile: Dockerfile.maintenance
    restart: unless-stopped
    env_file:
      - .env.maintenance
    environment:
      DB_HOST: db
      TZ: UTC
      CLEANUP_EXECUTION_MODE: scheduler
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pgdata:
