# Dependabot のバージョン更新設定。
# 既存の devcontainers エントリを維持し、リポジトリ内の依存マニフェストに合わせて拡張している。
# ignore 条件は未設定のため、このファイルでも追加しない。
# 参照:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# https://containers.dev/guide/dependabot

version: 2
updates:
  # Dev Containers の Features。
  # 対象: /.devcontainer/devcontainer.json と /.devcontainer/devcontainer-lock.json
  # directory は "/" を指定する。Dependabot が .devcontainer/ 配下を探索する。
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Cargo（アプリケーション本体）。
  # migration とは Cargo.lock が独立しているため、ディレクトリごとにグループ化する。
  # directories でまとめるとルートと migration が1つの PR に混ざる。
  # 対象: /Cargo.toml, /Cargo.lock
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      # major は minor-and-patch より先に評価し、sea-orm 系だけを組にする。
      sea-orm-major:
        applies-to: "version-updates"
        patterns:
          - "sea-orm"
          - "sea-orm-*"
          - "sea-query"
          - "sea-query-*"
          - "sea-schema"
          - "sea-schema-*"
        update-types:
          - "major"
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Cargo（マイグレーションクレート）。
  # 対象: /migration/Cargo.toml, /migration/Cargo.lock
  - package-ecosystem: "cargo"
    directory: "/migration"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      sea-orm-major:
        applies-to: "version-updates"
        patterns:
          - "sea-orm"
          - "sea-orm-*"
          - "sea-query"
          - "sea-query-*"
          - "sea-schema"
          - "sea-schema-*"
        update-types:
          - "major"
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Dockerfile。ファイル名に dockerfile を含むものを対象ディレクトリ内で探索する。
  # 同じベースイメージをルートと .devcontainer で揃えるため、ディレクトリは横断して1グループにする。
  # 対象: /Dockerfile.app, /Dockerfile.db, /Dockerfile.maintenance, /.devcontainer/Dockerfile
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker Compose。compose ファイルは docker エコシステムとは別に指定する。
  # 対象: /docker-compose.yml, /docker-compose.staging.yml, /.devcontainer/docker-compose.yml
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions。ワークフローのバージョン差分は同時に見るため、major を含む1グループにする。
  # directory は "/" を指定する。Dependabot が /.github/workflows を探索する。
  # 対象: /.github/workflows/ci.yml, ignored-db-tests.yml, deploy.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
