name: Ignored DB Tests

on:
  workflow_dispatch:
  schedule:
    # 毎日 02:00 UTC にDB結合テスト（testcontainersで一時PostgreSQLを起動）を実行
    # 補足:
    # - push 時実行（ci.yml）だけでも「コード変更起因の不具合」は検知できる
    # - 一方で定期実行を残すと、依存更新や runner/image 変更など
    #   「コード変更なしで起きる退行」も検知できる
    # - コスト優先にする場合は push(main/develop) へ寄せる運用も検討可能
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: ignored-db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  facade-integration-tests:
    # facade結合テストはtestcontainersが都度使い捨てのPostgreSQLコンテナを
    # 起動して実行する（tests/integration/facades/test_helper.rs参照）。
    # GitHub Actions の ubuntu-latest ランナーは標準でDockerデーモンが
    # 利用可能なため、追加のservicesコンテナ設定は不要。
    name: Run facade integration tests (testcontainers PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run facade integration tests
        run: cargo test -j 1 --test mod
